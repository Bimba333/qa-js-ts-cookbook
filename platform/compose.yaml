name: qa-book-platform

# Сервис прогресса книги.
#
# Отдельный compose, а не общий со стендом: стенд — учебная цель для тестов,
# а это инфраструктура самой книги. Смешивать их в одном запуске значило бы
# путать роли и мешать читателю останавливать стенд, не трогая свой прогресс.

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: qa_book_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - platform-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d qa_book_platform"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  app:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    image: qa-book-platform:local
    restart: "no"
    environment:
      PLATFORM_HTTP_HOST: 0.0.0.0
      PLATFORM_HTTP_PORT: "4320"
      PLATFORM_DATABASE_URL: postgres://platform:platform_local_only@postgres:5432/qa_book_platform
      PLATFORM_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:4320:4320"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4320/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  platform-data:
