name: Educational sharded diagnostics

"on":
  pull_request:
  schedule:
    - cron: "17 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    name: Shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run shard
        run: npx playwright test --config=examples/03-automation-qa/playwright.stability.config.ts examples/03-automation-qa/chapter-237 --shard="${{ matrix.shard }}/2"
      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stability-shard-${{ matrix.shard }}-of-2
          path: test-results/stability/passing
          if-no-files-found: error
          retention-days: 7
