name: Educational Playwright pipeline

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Static checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static checks
        run: npm run docs:ts:smoke
      - name: Run deterministic Playwright tests
        run: npx playwright test --config=examples/03-automation-qa/playwright.stability.config.ts
