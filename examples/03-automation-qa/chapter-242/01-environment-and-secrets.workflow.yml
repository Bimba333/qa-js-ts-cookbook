name: Educational environment contract

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qa-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate required configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -euo pipefail
          require_non_blank() {
            local value="${!1-}"
            test -n "${value//[[:space:]]/}"
          }
          require_non_blank API_BASE_URL
          require_non_blank API_TOKEN
      - name: Run deterministic tests
        run: npx playwright test --config=examples/03-automation-qa/playwright.stability.config.ts
