name: educational-work-items-phase1

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: "no"
    stop_grace_period: 10s
    environment:
      POSTGRES_DB: educational_work_items
      POSTGRES_USER: sut_bootstrap
      POSTGRES_PASSWORD: educational_bootstrap_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init/001-roles.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sut_reader -d educational_work_items",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
    name: educational-work-items-phase1-postgres-data
